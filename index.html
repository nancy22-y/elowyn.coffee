<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>elowyn.coffee - Excel 账目表</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen p-2 md:p-6">

  <div class="max-w-6xl mx-auto space-y-4">
    <!-- 头部与汇总 -->
    <header class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-amber-900">elowyn.coffee</h1>
        <p class="text-xs text-stone-400">住家式咖啡馆 · Excel 样式流水账表</p>
      </div>

      <div class="flex gap-6 text-sm">
        <div class="text-center">
          <span class="text-xs text-stone-400 block">总收入</span>
          <span id="totalIncome" class="font-bold text-emerald-600 text-base">$0.00</span>
        </div>
        <div class="text-center">
          <span class="text-xs text-stone-400 block">总开销</span>
          <span id="totalExpense" class="font-bold text-rose-600 text-base">$0.00</span>
        </div>
        <div class="text-center">
          <span class="text-xs text-stone-400 block">结余/净利润</span>
          <span id="netProfit" class="font-bold text-amber-900 text-base">$0.00</span>
        </div>
      </div>
    </header>

    <!-- 主表格区域 (Excel 视图) -->
    <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs md:text-sm">
          <!-- 表头 -->
          <thead>
            <tr class="bg-stone-200/70 text-stone-600 font-semibold border-b border-stone-300">
              <th class="p-2.5 border-r border-stone-300 w-32">日期</th>
              <th class="p-2.5 border-r border-stone-300 w-24">类型</th>
              <th class="p-2.5 border-r border-stone-300 w-32">分类</th>
              <th class="p-2.5 border-r border-stone-300">说明 / 项目明细</th>
              <th class="p-2.5 border-r border-stone-300 w-32 text-right">金额 ($ / RM)</th>
              <th class="p-2.5 text-center w-16">操作</th>
            </tr>
          </thead>

          <tbody>
            <!-- 快速新增行 (Excel 录入行) -->
            <tr class="bg-amber-50/50 border-b-2 border-amber-200">
              <td class="p-1 border-r border-stone-200">
                <input type="date" id="newDate" class="w-full bg-transparent p-1 focus:bg-white focus:outline-none text-xs">
              </td>
              <td class="p-1 border-r border-stone-200">
                <select id="newType" class="w-full bg-transparent p-1 font-medium focus:bg-white focus:outline-none text-xs">
                  <option value="income" class="text-emerald-600">📈 收入</option>
                  <option value="expense" class="text-rose-600">📉 支出</option>
                </select>
              </td>
              <td class="p-1 border-r border-stone-200">
                <select id="newCategory" class="w-full bg-transparent p-1 focus:bg-white focus:outline-none text-xs">
                  <option value="咖啡销售">咖啡销售</option>
                  <option value="豆子/牛奶">豆子/牛奶</option>
                  <option value="包装/消耗品">包装/消耗品</option>
                  <option value="设备/工具">设备/工具</option>
                  <option value="水电杂费">水电杂费</option>
                  <option value="其他">其他</option>
                </select>
              </td>
              <td class="p-1 border-r border-stone-200">
                <input type="text" id="newTitle" placeholder="+ 填写说明按回车保存" class="w-full bg-transparent p-1 focus:bg-white focus:outline-none text-xs">
              </td>
              <td class="p-1 border-r border-stone-200">
                <input type="number" step="0.01" id="newAmount" placeholder="0.00" class="w-full bg-transparent p-1 text-right font-bold focus:bg-white focus:outline-none text-xs">
              </td>
              <td class="p-1 text-center">
                <button onclick="addRecord()" class="bg-amber-800 hover:bg-amber-900 text-white text-xs px-2 py-1 rounded transition">添加</button>
              </td>
            </tr>

            <!-- 动态渲染数据行 -->
            <tbody id="tableBody">
              <!-- 数据行会通过 JS 添加到这里 -->
            </tbody>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 默认设置今天日期
      document.getElementById('newDate').value = new Date().toISOString().split('T')[0];
      
      // 在金额输入框回车直接保存
      document.getElementById('newAmount').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addRecord();
      });

      renderTable();
    });

    function addRecord() {
      const date = document.getElementById('newDate').value;
      const type = document.getElementById('newType').value;
      const category = document.getElementById('newCategory').value;
      const title = document.getElementById('newTitle').value.trim();
      const amount = parseFloat(document.getElementById('newAmount').value);

      if (!title || isNaN(amount)) {
        alert("请完整填写【说明】和【金额】！");
        return;
      }

      const record = { id: Date.now(), date, type, category, title, amount };
      const records = JSON.parse(localStorage.getItem('elowyn_excel_records') || '[]');
      records.unshift(record);
      localStorage.setItem('elowyn_excel_records', JSON.stringify(records));

      // 清空输入框
      document.getElementById('newTitle').value = '';
      document.getElementById('newAmount').value = '';

      renderTable();
    }

    function deleteRecord(id) {
      let records = JSON.parse(localStorage.getItem('elowyn_excel_records') || '[]');
      records = records.filter(r => r.id !== id);
      localStorage.setItem('elowyn_excel_records', JSON.stringify(records));
      renderTable();
    }

    function renderTable() {
      const records = JSON.parse(localStorage.getItem('elowyn_excel_records') || '[]');
      const tbody = document.getElementById('tableBody');

      let totalIncome = 0;
      let totalExpense = 0;

      if (records.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center py-6 text-stone-400">暂无任何数据，请在上方第一行输入并添加。</td>
          </tr>
        `;
      } else {
        tbody.innerHTML = records.map((item, index) => {
          const isIncome = item.type === 'income';
          if (isIncome) totalIncome += item.amount;
          else totalExpense += item.amount;

          return `
            <tr class="${index % 2 === 0 ? 'bg-white' : 'bg-stone-50'} hover:bg-amber-50/30 border-b border-stone-200 transition">
              <td class="p-2 border-r border-stone-200 font-mono text-xs text-stone-500">${item.date}</td>
              <td class="p-2 border-r border-stone-200 font-medium ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                ${isIncome ? '收入' : '支出'}
              </td>
              <td class="p-2 border-r border-stone-200 text-stone-600">${item.category}</td>
              <td class="p-2 border-r border-stone-200 text-stone-800 font-medium">${item.title}</td>
              <td class="p-2 border-r border-stone-200 text-right font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                ${isIncome ? '+' : '-'}$${item.amount.toFixed(2)}
              </td>
              <td class="p-2 text-center">
                <button onclick="deleteRecord(${item.id})" class="text-stone-300 hover:text-rose-500 text-xs font-bold">✕</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      // 更新顶部统计数据
      document.getElementById('totalIncome').innerText = `$${totalIncome.toFixed(2)}`;
      document.getElementById('totalExpense').innerText = `$${totalExpense.toFixed(2)}`;
      
      const profit = totalIncome - totalExpense;
      const profitEl = document.getElementById('netProfit');
      profitEl.innerText = `$${profit.toFixed(2)}`;
      profitEl.className = `font-bold text-base ${profit >= 0 ? 'text-emerald-700' : 'text-rose-600'}`;
    }
  </script>
</body>
</html>
