<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>elowyn.coffee - 开销与收据记录</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen p-4 md:p-8">

  <div class="max-w-xl mx-auto space-y-6">
    <!-- 头部标语 -->
    <header class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-amber-900 tracking-wide">elowyn.coffee</h1>
      <p class="text-sm text-stone-500">住家式咖啡馆 · 收据与开销自动识别</p>
    </header>

    <!-- 设置卡片：填写 API Key -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-200 space-y-2">
      <label class="block text-xs font-semibold text-stone-500 uppercase">Google Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="在此粘贴你的 API Key (AIzaSy...)" 
             class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-700">
      <p class="text-xs text-stone-400">密钥保存在浏览器本地，不会上传给第三方。</p>
    </div>

    <!-- 上传卡片 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 text-center space-y-4">
      <div class="border-2 border-dashed border-stone-300 rounded-xl p-6 hover:bg-stone-50 transition cursor-pointer relative">
        <input type="file" id="imageInput" accept="image/*" capture="environment" 
               class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="previewImage(event)">
        <div class="space-y-2" id="uploadPlaceholder">
          <div class="text-4xl">📷</div>
          <p class="text-sm font-medium text-stone-600">点击拍照或上传收据图片</p>
        </div>
        <img id="imagePreview" class="hidden max-h-48 mx-auto rounded-lg shadow-sm" />
      </div>

      <button onclick="analyzeReceipt()" id="btnAnalyze" 
              class="w-full bg-amber-800 hover:bg-amber-900 text-white font-medium py-3 rounded-xl shadow transition disabled:opacity-50">
        识别收据
      </button>
    </div>

    <!-- 结果卡片 -->
    <div id="resultCard" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-stone-200 space-y-4">
      <h2 class="font-bold text-stone-700 border-b pb-2">识别结果确认</h2>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-stone-500">日期</label>
          <input type="text" id="resDate" class="w-full font-mono bg-stone-50 p-2 rounded border border-stone-200 text-sm">
        </div>
        <div>
          <label class="text-xs text-stone-500">商家 / 供应商</label>
          <input type="text" id="resVendor" class="w-full bg-stone-50 p-2 rounded border border-stone-200 text-sm">
        </div>
        <div>
          <label class="text-xs text-stone-500">总金额 ($ / RM)</label>
          <input type="number" step="0.01" id="resAmount" class="w-full font-bold text-amber-900 bg-stone-50 p-2 rounded border border-stone-200 text-base">
        </div>
      </div>
      <button onclick="saveRecord()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5 rounded-xl transition">
        确认并记录
      </button>
    </div>

    <!-- 历史记录 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 space-y-4">
      <h2 class="font-bold text-stone-700 border-b pb-2">开销明细</h2>
      <div id="historyList" class="divide-y divide-stone-100 text-sm">
        <p class="text-stone-400 text-center py-4">暂无开销记录</p>
      </div>
    </div>
  </div>

  <script>
    // 页面加载时自动读取保存的 Key 和历史记录
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('apiKey').value = localStorage.getItem('gemini_key') || '';
      renderHistory();
    });

    document.getElementById('apiKey').addEventListener('input', (e) => {
      localStorage.setItem('gemini_key', e.target.value.trim());
    });

    let base64Image = "";

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result.split(',')[1];
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.classList.remove('hidden');
        document.getElementById('uploadPlaceholder').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    async function analyzeReceipt() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) return alert("请先填写 API Key！");
      if (!base64Image) return alert("请先上传或拍照一张收据！");

      const btn = document.getElementById('btnAnalyze');
      btn.disabled = true;
      btn.innerText = "AI 正在识别中...";

      const prompt = "请分析这张收据，提取日期(date, 格式YYYY-MM-DD)、商家名称(vendor)、总金额(total_amount, 仅数字)。请严格仅返回JSON，格式如下：{\"date\":\"...\",\"vendor\":\"...\",\"total_amount\":0.00}";

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });
        
        const data = await res.json();
        const textResp = data.candidates[0].content.parts[0].text;
        const cleanJson = textResp.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(cleanJson);

        document.getElementById('resDate').value = parsed.date || "";
        document.getElementById('resVendor').value = parsed.vendor || "";
        document.getElementById('resAmount').value = parsed.total_amount || 0;

        document.getElementById('resultCard').classList.remove('hidden');
      } catch (err) {
        alert("识别失败，请检查 API Key 或图片是否清晰。");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = "识别收据";
      }
    }

    function saveRecord() {
      const record = {
        date: document.getElementById('resDate').value,
        vendor: document.getElementById('resVendor').value,
        amount: parseFloat(document.getElementById('resAmount').value) || 0,
        time: new Date().toLocaleTimeString()
      };

      const history = JSON.parse(localStorage.getItem('expense_history') || '[]');
      history.unshift(record);
      localStorage.setItem('expense_history', JSON.stringify(history));

      renderHistory();
      document.getElementById('resultCard').classList.add('hidden');
      alert("记录保存成功！");
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('expense_history') || '[]');
      const container = document.getElementById('historyList');
      if (history.length === 0) {
        container.innerHTML = '<p class="text-stone-400 text-center py-4">暂无开销记录</p>';
        return;
      }
      container.innerHTML = history.map(item => `
        <div class="py-3 flex justify-between items-center">
          <div>
            <div class="font-medium text-stone-800">${item.vendor || '未提取到商家'}</div>
            <div class="text-xs text-stone-400">${item.date}</div>
          </div>
          <div class="font-bold text-amber-900">$${item.amount.toFixed(2)}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
